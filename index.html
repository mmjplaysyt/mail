<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMJ Mail</title>
    
    <!-- Supabase & Icons -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* --- MODERN "ATOMIC" UI CSS --- */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        :root {
            --bg-body: #f8fafc;
            --bg-sidebar: #ffffff;
            --bg-card: #ffffff;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        * { box-sizing: border-box; outline: none; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        .hidden { display: none !important; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .justify-center { justify-content: center; }
        .justify-between { justify-content: space-between; }
        .grow { flex-grow: 1; }
        .gap-2 { gap: 0.5rem; }
        .gap-4 { gap: 1rem; }
        .font-bold { font-weight: 700; }
        .cursor-pointer { cursor: pointer; }

        /* --- AUTH SCREEN --- */
        #auth-view {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            z-index: 50;
            display: flex; align-items: center; justify-content: center;
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid white;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1);
            border-radius: 24px;
            padding: 40px;
            width: 400px;
            text-align: center;
        }

        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .modern-input {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.2s;
            background: #f8fafc;
        }
        .modern-input:focus { border-color: var(--primary); background: white; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }

        .btn-primary {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex; justify-content: center; align-items: center; gap: 8px;
        }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-text { background: none; border: none; color: var(--primary); font-weight: 600; cursor: pointer; font-size: 14px; margin-top: 16px; }

        /* --- APP LAYOUT --- */
        #app-view { width: 100%; height: 100%; display: flex; }

        /* Sidebar */
        aside {
            width: 280px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 24px;
        }

        .logo {
            font-size: 20px;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 32px;
            display: flex; align-items: center; gap: 10px;
        }
        
        .compose-btn {
            background: var(--text-main);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 16px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            transition: transform 0.1s;
        }
        .compose-btn:active { transform: scale(0.98); }

        .nav-item {
            padding: 12px 16px;
            border-radius: 12px;
            color: var(--text-muted);
            font-weight: 500;
            cursor: pointer;
            display: flex; align-items: center; gap: 12px;
            margin-bottom: 4px;
        }
        .nav-item:hover { background: #f1f5f9; color: var(--text-main); }
        .nav-item.active { background: #eff6ff; color: var(--primary); font-weight: 600; }

        .user-profile {
            margin-top: auto;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            display: flex; align-items: center; gap: 12px;
        }
        .avatar {
            width: 40px; height: 40px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            color: white; font-weight: 700;
        }

        /* Main Content */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #fff;
            position: relative;
        }

        header {
            height: 80px;
            border-bottom: 1px solid var(--border);
            padding: 0 32px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .search-container {
            position: relative;
            width: 400px;
        }
        .search-container input {
            width: 100%;
            padding: 12px 12px 12px 44px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: #f8fafc;
            font-size: 14px;
        }
        .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }

        /* Email List Area */
        .email-list {
            flex: 1;
            overflow-y: auto;
            padding: 20px 32px;
        }
        
        .email-card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        .email-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: var(--primary); }
        .email-card.unread { border-left: 4px solid var(--primary); }
        .email-card.read { border-left: 4px solid transparent; opacity: 0.8; }

        .card-header { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .sender { font-weight: 600; color: var(--text-main); }
        .time { font-size: 12px; color: var(--text-muted); }
        .subject { font-weight: 600; font-size: 16px; margin-bottom: 6px; color: var(--text-main); }
        .preview { font-size: 14px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Detail View */
        #detail-view {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: white;
            z-index: 20;
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex; flex-direction: column;
        }
        #detail-view.open { transform: translateX(0); }
        
        .detail-nav {
            padding: 24px 32px;
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; gap: 16px;
        }
        .back-btn { background: none; border: none; cursor: pointer; color: var(--text-muted); padding: 8px; border-radius: 8px; }
        .back-btn:hover { background: #f1f5f9; color: var(--text-main); }
        
        .detail-content { padding: 40px; overflow-y: auto; flex: 1; }
        .detail-subject { font-size: 28px; font-weight: 700; margin-bottom: 24px; line-height: 1.2; }
        .detail-meta { display: flex; align-items: center; gap: 16px; margin-bottom: 32px; }
        .detail-avatar { width: 48px; height: 48px; border-radius: 14px; background: #e2e8f0; color: var(--text-muted); font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .detail-body { font-size: 16px; line-height: 1.7; color: var(--text-main); white-space: pre-wrap; }

        /* Modal */
        .modal-overlay {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
            z-index: 100;
            display: flex; align-items: center; justify-content: center;
        }
        .modal-window {
            background: white;
            width: 600px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.25);
            display: flex; flex-direction: column;
            overflow: hidden;
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        .modal-header { padding: 20px 32px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .modal-body { padding: 32px; }
        .modal-footer { padding: 20px 32px; background: #f8fafc; display: flex; justify-content: flex-end; gap: 12px; }
        
    </style>
</head>
<body>

    <!-- === AUTH VIEW === -->
    <div id="auth-view">
        <div class="auth-card">
            <div style="color: var(--primary); margin-bottom: 20px;">
                <i data-lucide="mail" size="48"></i>
            </div>
            <h1 id="auth-title" style="margin: 0 0 8px 0;">Welcome Back</h1>
            <p id="auth-desc" style="color: var(--text-muted); margin-bottom: 32px;">Enter your credentials to access your account</p>
            
            <form id="auth-form">
                <div id="signup-fields" class="hidden">
                    <div class="input-group">
                        <label>Choose Username</label>
                        <div class="flex gap-2">
                            <input type="text" id="username" class="modern-input" placeholder="e.g. admin" style="flex:1">
                            <span style="background:#e2e8f0; padding:0 15px; border-radius:12px; display:flex; align-items:center; font-weight:600; font-size:12px;">@mmjmail.com</span>
                        </div>
                    </div>
                </div>

                <div class="input-group">
                    <label>Email (Login)</label>
                    <input type="email" id="email" class="modern-input" placeholder="name@example.com">
                </div>
                
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password" class="modern-input" placeholder="••••••••">
                </div>
                
                <div id="auth-error" style="color: var(--danger); font-size: 13px; margin-bottom: 16px; display:none;"></div>
                
                <button type="submit" class="btn-primary" id="auth-btn">
                    <span id="auth-btn-text">Sign In</span>
                </button>
            </form>
            <button class="btn-text" onclick="toggleMode()" id="toggle-btn">Create an account</button>
        </div>
    </div>

    <!-- === APP VIEW === -->
    <div id="app-view" class="hidden">
        
        <!-- Sidebar -->
        <aside>
            <div class="logo">
                <i data-lucide="hexagon" fill="var(--primary)" color="var(--primary)"></i>
                MMJ Mail
            </div>
            
            <button class="compose-btn" onclick="openCompose()">
                <i data-lucide="pen-tool" size="18"></i> Compose
            </button>

            <nav style="margin-top: 24px; flex:1;">
                <div class="nav-item active" id="nav-inbox" onclick="switchTab('inbox')">
                    <i data-lucide="inbox" size="20"></i> Inbox
                </div>
                <div class="nav-item" id="nav-sent" onclick="switchTab('sent')">
                    <i data-lucide="send" size="20"></i> Sent
                </div>
            </nav>

            <div class="user-profile">
                <div class="avatar" id="my-avatar">U</div>
                <div style="flex:1;">
                    <div style="font-size:14px; font-weight:600;" id="my-email-display">Loading...</div>
                    <div style="font-size:12px; color:var(--text-muted);">Free Account</div>
                </div>
                <i data-lucide="log-out" size="18" class="cursor-pointer" onclick="signOut()" style="color:var(--text-muted)"></i>
            </div>
        </aside>

        <!-- Main Area -->
        <main>
            <header>
                <div class="search-container">
                    <i data-lucide="search" class="search-icon" size="18"></i>
                    <input type="text" placeholder="Search messages..." onkeyup="handleSearch(this.value)">
                </div>
            </header>

            <!-- List -->
            <div id="email-list" class="email-list">
                <!-- Emails go here -->
            </div>

            <!-- Detail Slide-over -->
            <div id="detail-view">
                <div class="detail-nav">
                    <button class="back-btn" onclick="closeDetail()"><i data-lucide="arrow-left"></i></button>
                    <span style="font-weight:600;">Back</span>
                </div>
                <div id="detail-content" class="detail-content"></div>
            </div>
        </main>
    </div>

    <!-- === COMPOSE MODAL === -->
    <div id="compose-modal" class="modal-overlay hidden">
        <div class="modal-window">
            <div class="modal-header">
                <h3 style="margin:0;">New Message</h3>
                <i data-lucide="x" class="cursor-pointer" onclick="closeCompose()"></i>
            </div>
            <div class="modal-body">
                <div class="input-group">
                    <label>To</label>
                    <input type="text" id="compose-to" class="modern-input" placeholder="Username or user@mmjmail.com">
                </div>
                <div class="input-group">
                    <label>Subject</label>
                    <input type="text" id="compose-subject" class="modern-input" placeholder="What is this about?">
                </div>
                <div class="input-group" style="margin-bottom:0;">
                    <label>Message</label>
                    <textarea id="compose-body" class="modern-input" rows="6" style="resize:none; padding-top:14px; font-family: inherit;" placeholder="Write your thoughts here..."></textarea>
                </div>
                <div id="compose-error" style="color:var(--danger); font-size:13px; margin-top:10px;"></div>
            </div>
            <div class="modal-footer">
                <button class="btn-text" onclick="closeCompose()" style="margin-top:0; color:var(--text-muted);">Discard</button>
                <button class="btn-primary" style="width: auto; padding: 10px 32px;" onclick="sendEmail()">
                    <i data-lucide="send" size="16"></i> Send Message
                </button>
            </div>
        </div>
    </div>

    <!-- === JAVASCRIPT LOGIC === -->
    <script>
        // --- CONFIG ---
        const SUPABASE_URL = "https://tjvcwwukbstddobmqbcf.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRqdmN3d3VrYnN0ZGRvYm1xYmNmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0OTU2MDQsImV4cCI6MjA5NDA3MTYwNH0.utm2LvKko-MbaVHSLiINRTPJ-_PJyyaYuKZ40zZUrXo";
        
        const { createClient } = supabase;
        const db = createClient(SUPABASE_URL, SUPABASE_KEY);
        lucide.createIcons();

        let currentUser = null;
        let virtualEmail = null;
        let isSignup = false;
        let emails = [];
        let activeTab = 'inbox';

        // --- INIT ---
        async function init() {
            const { data: { session } } = await db.auth.getSession();
            if (session) {
                currentUser = session.user;
                const loaded = await loadProfile(); 
                if (loaded) {
                    showApp();
                } else {
                    alert("Profile not found. Please logout and try again.");
                }
            }
        }

        // --- AUTH ---
        function toggleMode() {
            isSignup = !isSignup;
            const title = document.getElementById('auth-title');
            const desc = document.getElementById('auth-desc');
            const btnText = document.getElementById('auth-btn-text');
            const toggleBtn = document.getElementById('toggle-btn');
            const signupFields = document.getElementById('signup-fields');

            if (isSignup) {
                title.innerText = "Create Account";
                desc.innerText = "Register your internal email address";
                btnText.innerText = "Sign Up";
                toggleBtn.innerText = "Already have an account?";
                signupFields.classList.remove('hidden');
            } else {
                title.innerText = "Welcome Back";
                desc.innerText = "Enter your credentials to access your account";
                btnText.innerText = "Sign In";
                toggleBtn.innerText = "Create an account";
                signupFields.classList.add('hidden');
            }
            document.getElementById('auth-error').style.display = 'none';
        }

        document.getElementById('auth-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const emailInput = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const username = document.getElementById('username').value.trim().toLowerCase();
            const errorEl = document.getElementById('auth-error');

            try {
                if (isSignup) {
                    // --- SIGN UP LOGIC (Fixed) ---
                    if (!username) throw new Error("Username required");
                    
                    // 1. Create Auth User
                    const { data, error } = await db.auth.signUp({ email: emailInput, password: password });
                    if (error) throw error;

                    // 2. WAIT 2 Seconds (Crucial for Trigger to run)
                    await new Promise(r => setTimeout(r, 2000));

                    // 3. UPDATE existing profile (Do NOT Insert)
                    const vEmail = `${username}@mmjmail.com`;
                    
                    const { error: profErr } = await db.from('profiles')
                        .update({ virtual_email: vEmail })
                        .eq('id', data.user.id); // Match row created by trigger

                    if (profErr) throw new Error("Profile Update Failed: " + profErr.message);

                    currentUser = data.user;
                    virtualEmail = vEmail;
                    showApp();

                } else {
                    // --- LOGIN LOGIC ---
                    const { data, error } = await db.auth.signInWithPassword({ email: emailInput, password: password });
                    if (error) throw error;
                    
                    currentUser = data.user;
                    await loadProfile();
                    showApp();
                }
            } catch (err) {
                errorEl.innerText = err.message;
                errorEl.style.display = 'block';
            }
        });

        async function loadProfile() {
            const { data, error } = await db.from('profiles').select('virtual_email').eq('id', currentUser.id).single();
            
            if (error) {
                console.error("Load Profile Error:", error);
                return false;
            }
            
            if (data) {
                virtualEmail = data.virtual_email;
                document.getElementById('my-email-display').innerText = virtualEmail;
                document.getElementById('my-avatar').innerText = virtualEmail.charAt(0).toUpperCase();
                return true;
            }
            return false;
        }

        function showApp() {
            document.getElementById('auth-view').classList.add('hidden');
            document.getElementById('app-view').classList.remove('hidden');
            fetchEmails();
            setupRealtime();
        }

        async function signOut() {
            await db.auth.signOut();
            window.location.reload();
        }

        // --- APP LOGIC ---
        function switchTab(tab) {
            activeTab = tab;
            document.getElementById('nav-inbox').classList.toggle('active', tab === 'inbox');
            document.getElementById('nav-sent').classList.toggle('active', tab === 'sent');
            closeDetail();
            fetchEmails();
        }

        async function fetchEmails() {
            let query = db.from('messages').select('*').order('created_at', { ascending: false });
            if (activeTab === 'inbox') query = query.eq('receiver_email', virtualEmail);
            else query = query.eq('sender_id', currentUser.id);

            const { data } = await query;
            emails = data || [];
            renderList(emails);
        }

        function setupRealtime() {
            db.channel('public:messages')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                const msg = payload.new;
                const isForMe = msg.receiver_email === virtualEmail;
                const isFromMe = msg.sender_id === currentUser.id;

                if ((activeTab === 'inbox' && isForMe) || (activeTab === 'sent' && isFromMe)) {
                    emails.unshift(msg);
                    renderList(emails);
                }
            })
            .subscribe();
        }

        function renderList(list) {
            const container = document.getElementById('email-list');
            container.innerHTML = '';
            
            if (list.length === 0) {
                container.innerHTML = `<div style="text-align:center; color:var(--text-muted); margin-top:50px;">
                    <i data-lucide="inbox" size="48" style="opacity:0.2; margin-bottom:16px;"></i><br>No messages found.
                </div>`;
                lucide.createIcons();
                return;
            }

            list.forEach(email => {
                const el = document.createElement('div');
                el.className = `email-card ${email.read ? 'read' : 'unread'}`;
                const otherEmail = activeTab === 'inbox' ? email.sender_email : email.receiver_email;
                
                el.innerHTML = `
                    <div class="card-header">
                        <span class="sender">${otherEmail}</span>
                        <span class="time">${new Date(email.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
                    </div>
                    <div class="subject">${email.subject || 'No Subject'}</div>
                    <div class="preview">${email.body}</div>
                `;
                el.onclick = () => openDetail(email);
                container.appendChild(el);
            });
        }

        function handleSearch(val) {
            const lower = val.toLowerCase();
            const filtered = emails.filter(e => 
                e.subject.toLowerCase().includes(lower) || 
                e.body.toLowerCase().includes(lower)
            );
            renderList(filtered);
        }

        // --- DETAIL VIEW ---
        function openDetail(email) {
            if (!email.read && activeTab === 'inbox') {
                db.from('messages').update({ read: true }).eq('id', email.id);
                email.read = true;
                renderList(emails);
            }

            const otherEmail = activeTab === 'inbox' ? email.sender_email : email.receiver_email;
            const avatarChar = otherEmail.charAt(0).toUpperCase();

            document.getElementById('detail-content').innerHTML = `
                <h1 class="detail-subject">${email.subject || 'No Subject'}</h1>
                <div class="detail-meta">
                    <div class="detail-avatar">${avatarChar}</div>
                    <div>
                        <div style="font-weight:700;">${otherEmail}</div>
                        <div style="color:var(--text-muted); font-size:13px;">${new Date(email.created_at).toLocaleString()}</div>
                    </div>
                </div>
                <div class="detail-body">${email.body}</div>
            `;
            document.getElementById('detail-view').classList.add('open');
        }

        function closeDetail() {
            document.getElementById('detail-view').classList.remove('open');
        }

        // --- COMPOSE ---
        function openCompose() { document.getElementById('compose-modal').classList.remove('hidden'); }
        function closeCompose() { 
            document.getElementById('compose-modal').classList.add('hidden'); 
            document.getElementById('compose-error').innerText = '';
            document.getElementById('compose-to').value = '';
            document.getElementById('compose-subject').value = '';
            document.getElementById('compose-body').value = '';
        }

        async function sendEmail() {
            let to = document.getElementById('compose-to').value.trim().toLowerCase();
            const subject = document.getElementById('compose-subject').value.trim();
            const body = document.getElementById('compose-body').value.trim();
            const errEl = document.getElementById('compose-error');

            if(!to || !body) return;

            let finalTo = to;
            if (!finalTo.includes('@')) finalTo = `${finalTo}@mmjmail.com`;

            if (!finalTo.endsWith('@mmjmail.com')) {
                errEl.innerText = "Restricted: You can only mail users @mmjmail.com";
                return;
            }

            try {
                const { data, error } = await db.from('profiles').select('id').eq('virtual_email', finalTo).single();
                
                if (error || !data) throw new Error("User not found in system.");

                const { error: insertError } = await db.from('messages').insert({
                    sender_id: currentUser.id,
                    sender_email: virtualEmail,
                    receiver_email: finalTo,
                    subject,
                    body
                });

                if (insertError) throw insertError;
                closeCompose();
                if (activeTab === 'sent') fetchEmails();

            } catch (err) {
                errEl.innerText = err.message;
            }
        }

        init();
    </script>
</body>
</html>
